let lang="ar";
function render(){

  document.getElementById("logoMark").innerHTML = LOGO + `<span>QAYVRO<span class="os">OS</span></span>`;
  document.querySelectorAll("[data-i]").forEach(el=>{

  });
  document.getElementById("langBtn").textContent=t.langBtn;
  const waMsg = lang==="ar" ? "أرغب بتجربة QAYVRO لنشاطي — الاسم: ... / القطاع: ..." : "I would like a QAYVRO trial — Business: ... / Sector: ...";
  document.getElementById("waBtn").href = "https://wa.me/966541422220?text=" + encodeURIComponent(waMsg);

    `<div class="step"><span class="n">0${i+1}</span><b>${s[0]}</b><p>${s[1]}</p></div>`).join("");
  document.getElementById("chips").innerHTML=t.chips.map(c=>`<span>${c}</span>`).join("");
  document.getElementById("trust-list").innerHTML=t.trust.map(x=>`<div><i>✓</i>${x}</div>`).join("");
  document.getElementById("plans-grid").innerHTML=t.plans.map(p=>
    `<div class="plan${p.hot?" hot":""}">${p.hot?`<span class="badge">${p.badge}</span>`:""}
      <h4>${p.n}</h4><div class="who">${p.who}</div>
      <div class="price">${p.p}<small> ${p.per}</small></div>
      <ul>${p.f.map(x=>`<li><i>✓</i>${x}</li>`).join("")}</ul>
      <div class="cta"><a class="btn${p.hot?"":" ghost"}" href="#faq">${lang==="ar"?"اطلب تجربة":"Request trial"}</a></div>
    </div>`).join("");
  document.getElementById("faq").innerHTML=t.faq.map(f=>
    `<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
}
