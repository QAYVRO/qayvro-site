<style>
  :root{
    --ink:#0B1220; --card:#151F31; --line:#24334C;
    --text:#E9EFF8; --dim:#93A5BE; --accent:#3B82F6; --red:#E5534B; --ok:#34B27A;
    --disp:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
    --body:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);color:var(--text);font-family:var(--body);line-height:1.9;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px 80px}
  header{display:flex;align-items:center;justify-content:space-between;padding:26px 0;gap:12px;flex-wrap:wrap}
  .logo{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.5px}
  .logo b{color:var(--accent)}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:12px;
       padding:11px 22px;font-family:var(--body);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* hero */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding:48px 0 56px}
  @media(max-width:820px){.hero{grid-template-columns:1fr}}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.55;text-wrap:balance}
  h1 .red{color:var(--red)}
  .sub{color:var(--dim);margin-top:18px;max-width:52ch;font-size:16.5px}
  .cta-row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  /* brief mock */
  .brief{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
         box-shadow:0 24px 60px #0007}
  .brief h3{font-size:13.5px;color:var(--dim);font-weight:500;letter-spacing:.4px;margin-bottom:14px;
            display:flex;justify-content:space-between;align-items:center}
  .brief h3 .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
  .flag{border-inline-start:3px solid var(--red);padding:9px 12px;margin-bottom:9px;background:#1B2740;
        border-radius:0 8px 8px 0;font-size:13.5px}
  html[dir="rtl"] .flag{border-radius:8px 0 0 8px}
  .flag.y{border-color:#D4A72C}
  .flag small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .brief .act{display:flex;gap:8px;margin-top:14px}
  .brief .act span{font-size:12px;background:#20304C;color:#9FC0FF;border-radius:8px;padding:5px 12px}
  /* sections */
  section{margin-top:64px}
  .eyebrow{color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  h2{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.6;text-wrap:balance;margin-bottom:14px}
  p.lead{color:var(--dim);max-width:62ch}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
  @media(max-width:820px){.steps{grid-template-columns:repeat(2,1fr)}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .step b{display:block;margin-bottom:6px;font-size:15px}
  .step p{color:var(--dim);font-size:13.5px;line-height:1.8}
  .step .n{font-family:var(--disp);color:var(--accent);font-weight:800;font-size:22px;display:block;margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}
  .chips span{background:#1B2740;border:1px solid var(--line);color:#BBD0EC;border-radius:999px;
              padding:7px 18px;font-size:14px}
  .trust{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin-top:20px}
  @media(max-width:680px){.trust{grid-template-columns:1fr}}
  .trust div{padding:11px 0;border-top:1px solid var(--line);color:#C9D6E8;font-size:14.5px}
  .trust div::before{content:"✓";color:var(--ok);margin-inline-end:9px;font-weight:700}
  details{background:var(--card);border:1px solid var(--line);border-radius:14px;
          padding:16px 20px;margin-top:10px}
  summary{cursor:pointer;font-weight:700;font-size:15.5px}
  summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  details p{color:var(--dim);font-size:14.5px;margin-top:10px;max-width:70ch}
  .plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
  @media(max-width:900px){.plans{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.plans{grid-template-columns:1fr}}
  .plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column}
  .plan.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent), 0 18px 44px #0006;position:relative}
  .plan .badge{position:absolute;top:-12px;inset-inline-start:18px;background:var(--accent);color:#fff;
               font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 12px}
  .plan h4{font-family:var(--disp);font-size:18px}
  .plan .who{color:var(--dim);font-size:12.5px;margin-top:2px;min-height:34px}
  .plan .price{font-family:var(--disp);font-weight:800;font-size:30px;margin:12px 0 2px}
  .plan .price small{font-size:13px;color:var(--dim);font-weight:400}
  .plan ul{list-style:none;padding:0;margin:14px 0 0;flex:1}
  .plan li{font-size:13px;color:#C9D6E8;padding:6px 0;border-top:1px solid var(--line)}
  .plan li::before{content:"✓";color:var(--ok);margin-inline-end:8px;font-weight:700}
  .plan .cta{margin-top:16px;text-align:center}
  .plans-note{color:var(--dim);font-size:12.5px;margin-top:14px}
  .note{margin-top:64px;background:linear-gradient(135deg,#152238,#1B2740);border:1px solid var(--line);
        border-radius:18px;padding:30px;text-align:center}
  .note h2{margin-bottom:8px}
  .note p{color:var(--dim);max-width:56ch;margin:0 auto 6px}
  footer{margin-top:70px;color:#5B6B85;font-size:12.5px;text-align:center;border-top:1px solid var(--line);padding-top:26px}
  .preview-tag{background:#3A2B09;color:#E7C46B;font-size:11.5px;border-radius:7px;padding:3px 10px;vertical-align:middle}
  @media(prefers-reduced-motion:no-preference){
    .brief{animation:rise .7s ease both .15s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  }
</style>

  const waMsg = lang==="ar" ? "أرغب بتجربة QAYVRO لنشاطي — الاسم: ... / القطاع: ..." : "I would like a QAYVRO trial — Business: ... / Sector: ...";
  document.getElementById("waBtn").href = "https://wa.me/966541422220?text=" + encodeURIComponent(waMsg);

    `<div class="step"><span class="n">${i+1}</span><b>${s[0]}</b><p>${s[1]}</p></div>`).join("");
  document.getElementById("chips").innerHTML=t.chips.map(c=>`<span>${c}</span>`).join("");

  document.getElementById("plans-grid").innerHTML=t.plans.map(p=>
    `<div class="plan${p.hot?" hot":""}">${p.hot?`<span class="badge">${p.badge}</span>`:""}

    </div>`).join("");
  document.getElementById("faq").innerHTML=t.faq.map(f=>
    `<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("");
}
